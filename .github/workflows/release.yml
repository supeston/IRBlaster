name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/IRBlaster.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "IRBlaster v1.0.0"
          body: |
            ### IRBlaster v1.0.0

            - Полная база пультов Flipper-IRDB (125+ брендов ТВ, кондиционеры, проекторы, аудио и др.)
            - Разделы: Универсал, Брут, Джаммер и Инфо
            - Автор: @teffun (t.me/teffun)
            - Минималистичный интерфейс со шрифтом Unbounded-Bold
          files: release_assets/IRBlaster.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
