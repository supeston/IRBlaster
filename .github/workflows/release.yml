name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Extract Version Name
        id: get_version
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.1"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected Version: ${VERSION}"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/IRBlaster.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "IRBlaster v${{ steps.get_version.outputs.version }}"
          body: |
            ### IRBlaster v${{ steps.get_version.outputs.version }}

            - Добавлен удобный поиск брендов в разделах «Универсал» и «Брут»
            - Встроенная проверка обновлений внутри приложения
            - Навбар оптимизирован для узких экранов
            - Полная база пультов Flipper-IRDB (125+ брендов)
            - Автор: @teffun (t.me/teffun)
          files: release_assets/IRBlaster.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
